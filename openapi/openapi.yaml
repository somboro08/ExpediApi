components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GenericObject:
      type: object
      description: Schéma temporaire à remplacer par un DTO précis pour chaque opération.
      additionalProperties: true
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          description: Résultat ; définir un schéma spécifique par endpoint.
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
    UUID:
      type: string
      format: uuid
    CurrencyAmount:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Montant entier dans l’unité retenue par le contrat de paiement.
        currency:
          type: string
          example: XOF
    KycStatus:
      type: string
      enum: [not_submitted, pending, approved, rejected, expired]
    UserStatus:
      type: string
      enum: [pending, active, suspended, banned, deleted]
    UserRole:
      type: string
      enum: [visitor, sender, traveler, moderator, admin, super_admin]
    ListingStatus:
      type: string
      enum: [draft, published, paused, cancelled, hidden]
    BookingStatus:
      type: string
      description: Énumération provisoire ; transitions à confirmer.
      enum: [pending, accepted, paid, picked_up, in_transit, delivered, completed, cancelled, disputed]
    ISODateTime:
      type: string
      format: date-time
